name: Python Tests

on:
  push:
    branches: [main, release, develop, tests] 
  pull_request:
    branches: [main, release, develop, tests]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'  

    - name: Display info
      run: |
        echo "INFO:"
        echo "ФИО: Курбатов Максим Андреевич"
        echo "Группа: M3112"
        echo "GitHub Nickname: ${{ github.actor }}"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: pytest

    - name: Check code style
      run: |
        pip install flake8
        flake8 . || (echo "Code style issues found. Please fix them." && exit 1)